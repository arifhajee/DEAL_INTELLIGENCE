    ['overview', '🏠', 'Overview'], ['documents', '📂', 'Document Browser'], ['search', '🔍', 'Document Search'],

    const reviewCount = DATA.docs.filter(d => d.review && !d.reviewed).length;
    $('#nav').innerHTML = NAV.map(n => {
      if (n[0] === '§') return `<div class="nav-section">🛡 ${n[1]}</div>`;
      if (n[0] === '#') return `<div class="nav-group">${n[1]}</div>`;
      const cnt = n[3] && reviewCount ? `<span class="nav-count">${reviewCount}</span>` : '';
      return `<a href="#${n[0]}" class="nav-link${state.route === n[0] ? ' active' : ''}" data-route="${n[0]}"><span class="ico">${n[1]}</span>${n[2]}${cnt}</a>`;
    }).join('');
  }

    const [route, param] = (location.hash.slice(1) || 'overview').split('/');

    failed: ['#fee2e2', '#b91c1c'], processing: ['#dbeafe', '#1d4ed8'], abandoned: ['#e2e8f0', '#64748b'],
  };
  const badge = (text, [bg, fg] = ['#f1f5f9', '#475569']) => `<span class="badge" style="background:${bg};color:${fg}">${esc(text)}</span>`;
  const sectorBadge = s => badge(s, SECTOR_COLORS[s]);
  const statusBadge = s => badge(s, STATUS_COLORS[String(s).toLowerCase()]);
  const fmtTag = f => `<span class="fmt fmt-${esc(f)}">${esc(f)}</span>`;
  const confColor = c => c >= 0.75 ? '#16a34a' : c >= 0.5 ? '#d97706' : '#dc2626';
  const confText = c => `<b style="color:${confColor(c)}">${Math.round(c * 100)}%</b>`;
  const confBar = c => `<span class="conf" style="background:${confColor(c)}1a;color:${confColor(c)}"><span class="bar"><i style="width:${c * 100}%;background:${confColor(c)}"></i></span>${Math.round(c * 100)}%</span>`;
  const docLink = d => `<a class="link mono" href="#detail/${d.id}">${esc(d.file)}</a>`;

  // ---------- layout helpers ----------
  const header = (ico, title, sub, actions = '') => `<div class="page-header"><div><h1><span class="ico">${ico}</span>${esc(title)}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="row">${actions}</div></div>`;
  const stat = (lbl, val, s = '', color = '') => `<div class="card p4 stat"><div class="lbl">${lbl}</div><div class="val" style="${color ? `color:${color}` : ''}">${val}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  const tabs = (group, items, active = 0, cls = 'tabs') => `<div class="${cls}" data-tabs="${group}">${items.map((t, i) => `<button class="tab${i === active ? ' active' : ''}" data-tab="${group}-${i}">${t}</button>`).join('')}</div>`;
  const panel = (group, i, html, active = 0) => `<div class="tab-panel${i === active ? ' active' : ''}" data-panel="${group}-${i}">${html}</div>`;
  const empty = (ico, msg, sub = '') => `<div class="card empty"><div style="font-size:32px">${ico}</div><div style="font-weight:600;margin-top:8px;color:var(--text-2)">${msg}</div><div class="sub">${sub}</div></div>`;

  // ---------- charts (inline SVG) ----------
  const PALETTE = ['#29B5E8', '#11567F', '#C5A55A', '#7C3AED', '#22C55E', '#F59E0B', '#EF4444', '#0EA5E9'];
  function hbar(data, color = '#29B5E8') {
    const max = Math.max(...data.map(d => d[1])), rowH = 26, labelW = 130, w = 460, h = data.length * rowH;
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMinYMin meet">${data.map((d, i) => {
      const bw = (w - labelW - 40) * d[1] / max, y = i * rowH;
      return `<text x="${labelW - 8}" y="${y + 16}" text-anchor="end">${esc(d[0])}</text><rect x="${labelW}" y="${y + 5}" width="${bw}" height="16" rx="3" fill="${Array.isArray(color) ? color[i % color.length] : color}"/><text x="${labelW + bw + 6}" y="${y + 17}">${d[1]}</text>`;
    }).join('')}</svg>`;
  }
  function vbar(data, colors = PALETTE, h = 200) {
    const max = Math.max(...data.map(d => d[1])), w = 460, bottom = 36, gap = w / data.length, bw = Math.min(44, gap * 0.6);
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${data.map((d, i) => {
      const bh = (h - bottom - 18) * d[1] / max, x = i * gap + (gap - bw) / 2, y = h - bottom - bh;
      const lbl = d[0].length > 12 ? d[0].slice(0, 11) + '…' : d[0];
      return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${colors[i % colors.length]}"><title>${esc(d[0])}: ${d[1]}</title></rect><text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle">${d[1]}</text><text x="${x + bw / 2}" y="${h - bottom + 16}" text-anchor="middle">${esc(lbl)}</text>`;
    }).join('')}<line x1="0" x2="${w}" y1="${h - bottom}" y2="${h - bottom}" stroke="var(--border)"/></svg>`;
  }
  function donut(data, colors = PALETTE) {
    const total = data.reduce((s, d) => s + d[1], 0), r = 80, c = 2 * Math.PI * r;
    let off = 0;
    const arcs = data.map((d, i) => {
      const len = c * d[1] / total, seg = `<circle r="${r}" cx="100" cy="100" fill="none" stroke="${colors[i % colors.length]}" stroke-width="32" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(d[0])}: ${d[1]}</title></circle>`;
      off += len; return seg;
    }).join('');
    return `<div class="row" style="gap:20px;flex-wrap:nowrap"><svg viewBox="0 0 200 200" width="180" height="180">${arcs}<text x="100" y="96" text-anchor="middle" style="font-size:24px;font-weight:700;fill:var(--text)">${total}</text><text x="100" y="116" text-anchor="middle">documents</text></svg>
      <div class="legend" style="flex-direction:column">${data.map((d, i) => `<span><i style="background:${colors[i % colors.length]}"></i>${esc(d[0])} (${d[1]})</span>`).join('')}</div></div>`;
  }
  function line(labels, values, color = '#29B5E8', h = 180) {
    const w = 700, pad = 30, max = Math.max(...values) * 1.1, step = (w - pad * 2) / (values.length - 1);
    const pts = values.map((v, i) => [pad + i * step, h - pad - (h - pad * 2) * v / max]);
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
      <polygon points="${pad},${h - pad} ${pts.map(p => p.join(',')).join(' ')} ${w - pad},${h - pad}" fill="${color}" opacity=".12"/>
      <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5"/>
      ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${color}"><title>${labels[i]}: ${values[i]}</title></circle><text x="${p[0]}" y="${h - 10}" text-anchor="middle">${labels[i]}</text>`).join('')}
      <line x1="${pad}" x2="${w - pad}" y1="${h - pad}" y2="${h - pad}" stroke="var(--border)"/></svg>`;
  }
  const countBy = (arr, key) => Object.entries(arr.reduce((m, x) => (m[x[key]] = (m[x[key]] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]);

  // ---------- modal / toast ----------
  function openDoc(d) {
    $('#modal-title').textContent = d.file;
    $('#modal-body').innerHTML = `<div class="pdf">${pdfPage(d)}</div>`;
    $('#modal').classList.add('open');
  }
  function pdfPage(d, hl = []) {
    let body = esc(d.summary) + '<br><br>' + esc(`Key risks: ${d.risks}. Action required: ${d.action}.`);
    hl.filter(Boolean).forEach(t => { body = body.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>'); });
    return `<div class="pdf-page"><div style="font-size:9px;color:#9ca3af;text-transform:uppercase;letter-spacing:.1em">Confidential · ${esc(d.folder)}</div>
      <h3 style="margin-top:14px">${esc(d.type.toUpperCase())}</h3><div style="color:#6b7280;margin-bottom:16px">${esc(d.deal !== '—' ? d.deal : d.fund)} · ${esc(d.company !== '—' ? d.company : 'Fund-level')}</div>
      <p>${body}</p>
      <table style="width:100%;border-collapse:collapse;margin-top:16px;font-family:Inter,sans-serif;font-size:10px">${[['Enterprise Value', d.ev], ['Equity', d.equity], ['Target IRR', d.irr], ['Target MOIC', d.moic], ['Co-Investors', d.coinv], ['Fund', d.fund]].map(r => `<tr><td style="border-bottom:1px solid #e5e7eb;padding:4px 0;color:#6b7280">${r[0]}</td><td style="border-bottom:1px solid #e5e7eb;padding:4px 0;text-align:right;font-weight:600">${esc(r[1])}</td></tr>`).join('')}</table>
      <div style="margin-top:40px;color:#9ca3af;font-size:9px;text-align:center">Page 1 of ${d.pages}</div></div>`;
  }
  function toast(msg, type = 'success') {
    const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = (type === 'success' ? '✓ ' : 'ℹ ') + msg;
    $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3500);
  }

  // ---------- theme ----------
  function setTheme(mode) {
    const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
    $$('#theme-seg button').forEach(b => b.classList.toggle('on', b.dataset.theme === mode));
  }

  // ---------- global delegated events ----------
  function bindGlobal() {
    document.addEventListener('click', e => {
      const tab = e.target.closest('[data-tab]');
      if (tab) {
        const bar = tab.parentElement, group = bar.dataset.tabs, key = tab.dataset.tab;
        $$('.tab', bar).forEach(t => t.classList.toggle('active', t === tab));
        $$(`[data-panel^="${group}-"]`).forEach(p => p.classList.toggle('active', p.dataset.panel === key));
      }
      const sw = e.target.closest('.switch');
      if (sw) { sw.classList.toggle('on'); toast(sw.classList.contains('on') ? 'Enabled' : 'Disabled', 'info'); }
      const t = e.target.closest('[data-toast]');
      if (t) toast(t.dataset.toast);
      const nav = e.target.closest('[data-go]');
      if (nav) { e.preventDefault(); go(nav.dataset.go); }
      const pv = e.target.closest('[data-preview]');
      if (pv) { e.preventDefault(); openDoc(DATA.docs.find(d => d.id == pv.dataset.preview)); }
      if (!e.target.closest('#user-btn') && !e.target.closest('#user-dd')) $('#user-dd').classList.remove('open');
    });
    $('#user-btn').addEventListener('click', () => $('#user-dd').classList.toggle('open'));
    $('#theme-seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.theme); });
    $('#signout').addEventListener('click', e => { e.preventDefault(); toast('Sign-out is disabled in the demo', 'info'); });
    $('#modal-close').addEventListener('click', () => $('#modal').classList.remove('open'));
    $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').classList.remove('open'); });
    $('#modal-dl').addEventListener('click', () => toast('Download is simulated in the demo', 'info'));
    $('#menu-toggle').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').classList.remove('open'); });
    window.addEventListener('hashchange', onHash);
  }

  function start() { bindGlobal(); onHash(); }

  return { $, $$, esc, pages, state, go, renderNav, badge, sectorBadge, statusBadge, fmtTag, confText, confBar, confColor, docLink, header, stat, tabs, panel, empty, hbar, vbar, donut, line, countBy, PALETTE, openDoc, pdfPage, toast, start };
})();

</script>

      const batch = () => { const n = $$('.rowchk:checked').length; $('#batch').classList.toggle('hidden', !n); $('#batch-n').textContent = `${n} selected`; };

  };

  // ---------- Document Detail ----------

      const raw = `${d.type.toUpperCase()}\n\n${d.deal} — <mark class="m-party">${d.company}</mark>\nDeal Code: <mark class="m-id">${d.code}</mark>\nFund: <mark class="m-party">${d.fund}</mark>\nSector: <mark class="m-cls">${d.sector}</mark>\nInvestment Date: <mark class="m-date">${d.invDate}</mark>\n\nTRANSACTION SUMMARY\nEnterprise Value: <mark class="m-money">${d.ev}</mark>\nEquity Check: <mark class="m-money">${d.equity}</mark>\nTarget IRR: ${d.irr}   Target MOIC: ${d.moic}\nCo-Investors: ${d.coinv}\n\nEXECUTIVE SUMMARY\n${d.summary}\n\nKEY RISKS\n${d.risks}\n\nACTION REQUIRED\n${d.action}`;
      return `<div class="page-wrap w-6xl"><a class="link" href="#documents">← Back</a>
        <div class="row between mt"><div><div style="font-size:18px;font-weight:700" class="mono">${esc(d.file)}</div>
          <div class="row mt"><span class="badge" style="background:#dbeafe;color:#1d4ed8">${esc(d.type)}</span>${sectorBadge(d.sector)}${confBar(d.conf)}<span class="badge" style="background:#d1fae5;color:#047857">COMPLETE</span></div></div>
          <div class="row"><button class="btn btn-secondary btn-sm" id="bm">🔖 Save</button><button class="btn btn-secondary btn-sm" data-preview="${d.id}">👁 Preview</button><button class="btn btn-secondary btn-sm" style="color:#b45309" data-toast="Document archived">Archive</button><button class="btn btn-secondary btn-sm" style="color:#dc2626" data-toast="Purge requires confirmation in production">Purge</button></div></div>
        <div class="mt2">${tabs('dt', ['📄 Document', '🕐 History', `👥 Related <span class="cnt">${related.length}</span>`, '≡ Raw Text'])}
        ${panel('dt', 0, `<div class="split"><div class="main"><div class="row mb"><input id="doc-q" style="flex:1" placeholder="Search within this document..."><span class="sub" id="doc-qn"></span></div>
            <div class="card"><div class="row between p4" style="background:var(--surface-alt);border-bottom:1px solid var(--border);padding:8px 12px"><span class="row sub"><button class="btn btn-secondary btn-sm">‹</button>Page 1 of ${d.pages}<button class="btn btn-secondary btn-sm">›</button></span><span class="sub" id="doc-hl" style="color:#b45309"></span></div><div class="pdf" id="doc-pdf">${pdfPage(d)}</div></div></div>
          <div class="side-panel card p4"><b>Attributes</b>${attr('Target Company', esc(d.company))}${attr('Sponsor', esc(d.sponsor))}${attr('Document Type', esc(d.type))}${attr('Deal Code', `<span class="mono">${d.code}</span>`)}${attr('Fund Name', esc(d.fund))}${attr('Sector', sectorBadge(d.sector))}${attr('Deal Stage', esc(d.stage) + (d.review ? ' <span class="chip" style="background:#fef3c7;color:#b45309">Pending</span>' : ''))}${attr('Status', statusBadge(d.status))}${attr('Investment Date', d.invDate)}${attr('Exit Date', d.exitDate)}${attr('Enterprise Value', d.ev, false)}${attr('Target IRR / MOIC', `${d.irr} / ${d.moic}`, false)}${attr('Key Risks', esc(d.risks), false)}${attr('Action Required', esc(d.action), false)}</div></div>`)}
        ${panel('dt', 1, `<div class="card p5"><div class="tl">${[['#22c55e', '✓', 2, 'COMPLETE', '2024-09-20 10:14', ''], ['#ef4444', '!', 1, 'FAILED', '2024-09-19 22:03', '[EXTRACT] Model timeout after 120s'], ['#f59e0b', '↻', 1, 'RETRY', '2024-09-19 21:45', '']].map(v => `<div class="tl-item"><div class="tl-dot" style="background:${v[0]}">${v[1]}</div><div class="row"><b>Version ${v[2]}</b>${statusBadge(v[3].toLowerCase() === 'retry' ? 'pending' : v[3])}<span class="sub">1 attempt · Completed ${v[4]}</span></div>${v[5] ? `<div class="note note-red mt">${v[5]}</div>` : ''}</div>`).join('')}</div></div>`)}
        ${panel('dt', 2, related.length ? `<div class="card table-wrap"><table class="t"><thead><tr><th>Document</th><th>Type</th><th>Target Company</th><th>Sector</th><th>Status</th></tr></thead><tbody>${related.map(r => `<tr><td>${docLink(r)}</td><td>${esc(r.type)}</td><td>${esc(r.company)}</td><td>${sectorBadge(r.sector)}</td><td>${statusBadge(r.status)}</td></tr>`).join('')}</tbody></table></div>` : empty('👥', 'No related documents'))}
        ${panel('dt', 3, `<div class="row between mb"><span class="sub">${d.pages} pages · Extracted text content</span><label class="row sub"><input type="checkbox" id="hl-toggle" checked> Highlight values</label></div>
          <div class="row mb" style="font-size:11px"><mark class="m-id">Identifiers</mark><mark class="m-party">Parties</mark><mark class="m-date">Dates</mark><mark class="m-money">Monetary</mark><mark class="m-cls">Classification</mark></div><pre class="raw" id="raw">${raw}</pre>`)}</div></div>`;
    },
    mount: (root, id) => {
      const d = byId(id) || D[0];
      $('#doc-q').addEventListener('input', e => {
        const terms = e.target.value.split(/\s+/).filter(t => t.length > 2);
        $('#doc-pdf').innerHTML = pdfPage(d, terms);
        const n = $$('#doc-pdf mark').length;
        $('#doc-qn').textContent = terms.length ? `${n} matches on page 1` : '';
        $('#doc-hl').textContent = terms.length ? `Highlighting: ${terms.join(', ')}` : '';
      });
      $('#bm').addEventListener('click', e => { e.currentTarget.textContent = '🔖 Saved'; toast('Bookmarked'); });
      $('#hl-toggle').addEventListener('change', e => $$('#raw mark').forEach(m => m.style.background = e.target.checked ? '' : 'transparent'));
    },
  };

  // ---------- Search ----------
  const SUGGEST = ['IC Presentations', 'DD Reports', 'Term Sheets', 'LP Reports', 'Board Decks', 'Valuation Memos'];
  pages.search = {
    render: q => `<div class="page-wrap w-7xl">${header('🔍', 'Document Search', 'Hybrid semantic + keyword search powered by Cortex Search')}
      <div class="card p4 mb"><div class="row"><input id="s-q" style="flex:1" placeholder="e.g. data center acquisition due diligence risks" value="${esc(q || '')}"><button class="btn btn-primary" id="s-go">Search</button><button class="btn btn-secondary" id="s-f">Filters ▾</button><button class="btn btn-secondary" data-toast="Search saved to Saved Items">💾</button></div>
        <div class="row mt hidden" id="s-filters"><select id="s-sector">${opts(uniq('sector'), 'All Sectors')}</select><select>${opts(uniq('type'), 'All Doc Types')}</select><select>${opts(['PDF', 'DOCX', 'TIFF'], 'All Formats')}</select><select>${opts(uniq('status'), 'All Statuses')}</select><select><option>20 results</option><option>50 results</option></select></div></div>
      <div id="s-out"></div></div>`,
    mount: (root, q) => {
      const run = () => {
        const text = $('#s-q').value.trim(), sec = $('#s-sector').value;
        if (!text) {
          $('#s-out').innerHTML = `<div class="card p5"><div class="sub mb">Suggested searches:</div><div class="grid g3">${SUGGEST.map(s => `<button class="btn btn-secondary" data-sug="${s}">${s}</button>`).join('')}</div></div>`; return;
        }
        const words = text.toLowerCase().split(/\s+/);
        const scored = D.filter(d => !sec || d.sector === sec).map(d => {
          const hay = [d.type, d.company, d.deal, d.summary, d.risks, d.sector, d.folder].join(' ').toLowerCase();
          return { d, s: words.reduce((n, w) => n + (hay.includes(w.replace(/s$/, '')) ? 1 : 0), 0) + d.conf * 0.1 };
        }).filter(x => x.s >= 1).sort((a, b) => b.s - a.s);
        const res = scored.length ? scored : D.slice(0, 5).map(d => ({ d, s: 0.5 }));
        $('#s-out').innerHTML = `<div class="split"><div class="main card"><div class="row between p4" style="border-bottom:1px solid var(--border)"><span class="sub"><b>${res.length}</b> semantic matches · ${120 + res.length * 7}ms</span><span class="sub">Page 1 of 1</span></div>
          <div class="table-wrap"><table class="t"><thead><tr><th>Document Type</th><th>Company</th><th>Sector</th><th>Status</th><th>Match</th><th></th></tr></thead><tbody>${res.map(({ d }) => `<tr class="clickable" data-id="${d.id}"><td><b>${esc(d.type)}</b> ${fmtTag(d.fmt)}</td><td>${esc(d.company)}</td><td>${sectorBadge(d.sector)}</td><td>${statusBadge(d.status)}</td><td class="sub">${esc(d.summary.slice(0, 60))}…</td><td style="white-space:nowrap"><button class="btn-sm" style="border:0;background:none" data-toast="Thanks for the feedback">👍</button><button class="btn-sm" style="border:0;background:none" data-toast="Thanks for the feedback">👎</button></td></tr>`).join('')}</tbody></table></div></div>
          <div class="side-panel" id="s-panel"></div></div>`;
        showPanel(res[0].d, words);
        $('#s-out tbody').addEventListener('mouseover', e => { const tr = e.target.closest('tr[data-id]'); if (tr) showPanel(byId(tr.dataset.id), words); });
        $('#s-out tbody').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr && !e.target.closest('button')) DI.go('detail', tr.dataset.id); });
      };
      const showPanel = (d, words) => {
        let snip = esc(d.summary); words.filter(w => w.length > 3).forEach(w => snip = snip.replace(new RegExp(`(${w.replace(/s$/, '')}\\w*)`, 'gi'), '<mark>$1</mark>'));
        $('#s-panel').innerHTML = `<div class="card p4"><div class="lbl-up">Document Details</div><div style="font-size:18px;font-weight:600;margin:6px 0">${esc(d.type)}</div><div class="row">${sectorBadge(d.sector)}${statusBadge(d.status)}${fmtTag(d.fmt)}</div>
          <div class="note note-amber mt">Matched on ${1 + d.id % 3} pages<br><i>“${snip}”</i></div>
          <dl class="kv mt">${[['Target Company', d.company], ['Sponsor', d.sponsor], ['Deal Stage', d.stage], ['Investment Date', d.invDate], ['Enterprise Value', d.ev], ['Deal Code', d.code], ['Fund', d.fund]].map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}<dt>Confidence</dt><dd>${confText(d.conf)}</dd></dl>
          <div class="mt row between"><a class="link mono" href="#" data-preview="${d.id}">📄 Preview</a><a class="link" href="#detail/${d.id}">↗ Open full detail</a></div></div>`;
      };
      $('#s-go').addEventListener('click', run); $('#s-q').addEventListener('keydown', e => e.key === 'Enter' && run());
      $('#s-f').addEventListener('click', () => $('#s-filters').classList.toggle('hidden'));
      $('#s-sector').addEventListener('change', run);
      $('#s-out').addEventListener('click', e => { const b = e.target.closest('[data-sug]'); if (b) { $('#s-q').value = b.dataset.sug; run(); } });
      run();
    },
  };

  // ---------- Review Queue ----------
  pages.review = {
    render: () => `<div class="page-wrap w-5xl">${header('🛡', 'Review Queue', 'Scope: All Sectors · All document types', '<button class="btn btn-secondary btn-sm" data-toast="Queue refreshed">↻ Refresh</button>')}
      <div class="card p4 mb"><div class="row between"><span id="rv-sum" class="sub"></span><b id="rv-pct" style="color:#16a34a"></b></div><div style="height:8px;background:var(--surface-hover);border-radius:4px;margin-top:8px;display:flex;overflow:hidden"><i id="rv-a" style="background:#22c55e"></i><i id="rv-s" style="background:#94a3b8"></i></div></div>
      <div class="card p4 mb row"><select>${opts(uniq('sector'), 'All Sectors')}</select><select>${opts(uniq('type'), 'All Classifications')}</select><input style="flex:1" placeholder="Search company, deal, fund..."></div>
      <div class="tabs" id="rv-tabs"><button class="tab active" data-f="pending">Pending <span class="cnt hot" id="c-p"></span></button><button class="tab" data-f="approved">Approved <span class="cnt" id="c-a"></span></button><button class="tab" data-f="skipped">Skipped <span class="cnt" id="c-s"></span></button><button class="tab" data-f="all">All</button></div>
      <div id="rv-list"></div></div>`,
    mount: () => {
      const items = D.filter(d => d.review);
      let filter = 'pending';
      const alts = { 'Commercial DD': ['Technical DD', 'Market Study'], 'Credit Agreement': ['Term Sheet', 'Financing Commitment'], 'ESG Report': ['Environmental DD', 'Compliance Certificate'], 'Financial Model': ['Valuation Memo', 'Budget / Forecast'], 'Legal DD': ['SPA', 'Closing Checklist'] };
      const reasons = { 8: 'Draft watermark detected; stage inferred from filename', 11: 'Multiple document types score within 10%', 13: 'Scanned TIFF with low OCR confidence', 14: 'Spreadsheet export — sparse text content', 15: 'Memo format overlaps SPA disclosure schedules' };
      const draw = () => {
        const a = items.filter(d => d.reviewed === 'approved').length, s = items.filter(d => d.reviewed === 'skipped').length, p = items.length - a - s;
        $('#rv-sum').textContent = `${p} pending · ${a} approved · ${s} skipped`; $('#rv-pct').textContent = `${Math.round((a + s) / items.length * 100)}% complete`;
        $('#rv-a').style.width = `${a / items.length * 100}%`; $('#rv-s').style.width = `${s / items.length * 100}%`;
        $('#c-p').textContent = p; $('#c-a').textContent = a; $('#c-s').textContent = s;
        const shown = items.filter(d => filter === 'all' || (filter === 'pending' ? !d.reviewed : d.reviewed === filter));
        $('#rv-list').innerHTML = shown.length ? shown.map(d => `<div class="card p4 mb${d.reviewed === 'skipped' ? ' fade' : ''}" style="${d.reviewed === 'approved' ? 'border-color:#86efac' : ''}"><div class="row between" style="align-items:flex-start"><div style="flex:1;min-width:260px">
            <div class="row"><b class="mono" style="font-size:13px">${esc(d.file)}</b></div><div class="row mt"><span class="badge" style="background:#dbeafe;color:#1d4ed8">${esc(d.type)}</span>${sectorBadge(d.sector)}<span class="sub">${esc(d.folder)}</span>${confBar(d.conf)}</div>
            <div class="note note-amber mt"><b>Review reason:</b> ${reasons[d.id] || 'Confidence below threshold'}</div>
            <div class="sub mt">Also considered: ${(alts[d.type] || ['Investment Memo']).map(x => `<span class="chip">${x}</span>`).join(' ')}</div><div class="sub mt">Company: ${esc(d.company)} · Deal: ${esc(d.deal)} · Fund: ${esc(d.fund)}</div></div>
            <div style="display:flex;flex-direction:column;gap:6px;position:relative">${d.reviewed ? `<span class="badge" style="background:${d.reviewed === 'approved' ? '#d1fae5;color:#047857' : '#f1f5f9;color:#475569'}">${d.reviewed}</span><button class="btn btn-secondary btn-sm" data-undo="${d.id}">Undo</button>` :
            `<button class="btn btn-green btn-sm" data-act="approved" data-id="${d.id}">✓ Approve</button><button class="btn btn-secondary btn-sm" data-act="skipped" data-id="${d.id}">⏭ Skip</button><button class="btn btn-amber btn-sm" data-corr="${d.id}">→ Correct ▾</button>
            <div class="dropdown" id="cd-${d.id}" style="top:100px;width:220px"><div class="dd-sec lbl-up">Select correct type:</div>${(alts[d.type] || ['Investment Memo']).map(x => `<a href="#" class="list-row" data-fix="${d.id}" data-type="${x}">${x}</a>`).join('')}<a class="list-row link" href="#detail/${d.id}">Open detail for manual correction…</a></div>`}</div></div></div>`).join('')
          : empty('✅', 'No documents pending review', 'All caught up!');
        DI.renderNav();
      };
      $('#rv-tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (!t) return; $$('#rv-tabs .tab').forEach(x => x.classList.toggle('active', x === t)); filter = t.dataset.f; draw(); });
      $('#rv-list').addEventListener('click', e => {
        const act = e.target.closest('[data-act]'), undo = e.target.closest('[data-undo]'), corr = e.target.closest('[data-corr]'), fix = e.target.closest('[data-fix]');
        if (act) { byId(act.dataset.id).reviewed = act.dataset.act; toast(act.dataset.act === 'approved' ? 'Classification approved' : 'Skipped for now'); draw(); }
        if (undo) { delete byId(undo.dataset.undo).reviewed; draw(); }
        if (corr) $(`#cd-${corr.dataset.corr}`).classList.toggle('open');
        if (fix) { e.preventDefault(); const d = byId(fix.dataset.fix); d.type = fix.dataset.type; d.reviewed = 'approved'; toast(`Reclassified as ${fix.dataset.type}`); draw(); }
      });
      draw();
    },
  };

  // ---------- Chat ----------
  const thread = [
    { u: 'What are the key risks in our Digital Infrastructure investments?' },
    { a: ANSWERS[0] },
    { u: 'How many deals by sector are in due diligence this year?' },
    { a: ANSWERS[1] },
  ];
  const msgHtml = m => m.u ? `<div class="msg user"><div class="av">👤</div><div class="bubble">${esc(m.u)}</div></div>`
    : `<div class="msg bot"><div class="av">🤖</div><div style="max-width:85%"><span class="via">${m.a.tool === 'Cortex Analyst' ? '📊' : '⚡'} via ${m.a.tool}</span><div class="bubble" style="max-width:100%">${m.a.html}${m.a.chart ? `<div class="card p4 mt chart"><div class="chart-title">Deals in Due Diligence by Sector</div>${vbar([['Energy Transition', 3], ['Transportation', 1], ['Digital Infra', 0], ['Water', 0]], PALETTE, 170)}</div>` : ''}</div>
      <div class="row" style="margin-top:4px"><button class="btn-sm" style="border:0;background:none" data-toast="Feedback recorded">👍</button><button class="btn-sm" style="border:0;background:none" data-toast="Feedback recorded">👎</button></div></div></div>`;
  pages.chat = {
    render: () => `<div class="page-wrap w-3xl" style="display:flex;flex-direction:column;min-height:calc(100vh - 140px)">${header('🤖', 'Doc Intelligence Agent', 'Find documents, read content, or ask questions that span search and data', '<button class="btn btn-secondary btn-sm" id="c-new">↺ New conversation</button>')}
      <div id="c-thread" style="flex:1"></div>
      <div class="card p4" style="position:sticky;bottom:0"><div class="row"><input id="c-in" style="flex:1" placeholder="Ask the Doc Intelligence Agent…"><button class="btn btn-primary" id="c-send">Send</button></div></div></div>`,
    mount: (root, q) => {
      const draw = () => {
        $('#c-thread').innerHTML = thread.length ? thread.map(msgHtml).join('') : `<div class="card p6" style="text-align:center"><div style="font-size:36px">🤖</div><b>Doc Intelligence Agent</b><div class="sub">Powered by <span class="mono">DEAL_INTELLIGENCE_AGENT</span></div>
          <div class="grid mt" style="text-align:left">${QUICK.map(x => `<button class="btn btn-secondary" style="justify-content:flex-start;white-space:normal" data-q="${esc(x)}">💬 ${esc(x)}</button>`).join('')}</div></div>`;
      };
      const send = text => {
        text = (text || $('#c-in').value).trim(); if (!text) return;
        thread.push({ u: text }); $('#c-in').value = ''; draw();
        $('#c-thread').insertAdjacentHTML('beforeend', `<div class="msg bot" id="typing"><div class="av">🤖</div><div class="bubble"><div class="sub" style="font-style:italic;margin-bottom:6px">Planning the next steps…</div><div class="dots"><span></span><span></span><span></span></div></div></div>`);
        $('#content').scrollTop = 1e6;
        setTimeout(() => { thread.push({ a: answer(text) }); draw(); $('#content').scrollTop = 1e6; }, 1400);
      };
      $('#c-send').addEventListener('click', () => send()); $('#c-in').addEventListener('keydown', e => e.key === 'Enter' && send());
      $('#c-new').addEventListener('click', () => { thread.length = 0; draw(); });
      $('#c-thread').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) send(b.dataset.q); });
      draw();
      if (q) send(q);
    },
  };

  // ---------- Saved ----------
  pages.saved = {
    render: () => `<div class="page-wrap w-4xl">${header('🔖', 'Saved Items', 'Saved searches and bookmarked documents')}
      ${tabs('sv', [`Saved Searches <span class="cnt">${DATA.savedSearches.length}</span>`, `Bookmarks <span class="cnt">${DATA.bookmarks.length}</span>`])}
      ${panel('sv', 0, DATA.savedSearches.map(s => `<div class="card p4 mb row between"><div><b>${esc(s.name)}</b><div class="sub">“${esc(s.q)}”</div><div class="sub muted">🕐 ${s.date}</div></div><div class="row"><a class="btn btn-secondary btn-sm" href="#search/${encodeURIComponent(s.q)}">▶ Run</a><button class="btn btn-secondary btn-sm" data-toast="Link copied">🔗 Copy link</button><button class="btn btn-secondary btn-sm" data-toast="Saved search deleted">🗑</button></div></div>`).join(''))}
      ${panel('sv', 1, DATA.bookmarks.map(b => { const d = byId(b.doc); return `<a class="card p4 mb row between" href="#detail/${d.id}"><div class="row" style="align-items:flex-start"><span class="gold" style="font-size:18px">🔖</span><div><b>${esc(d.type)}</b> — ${esc(d.company !== '—' ? d.company : d.fund)}<div class="sub"><i>${esc(b.note)}</i></div><div class="mono muted">${esc(d.file)} · ${b.date}</div></div></div><span>›</span></a>`; }).join(''))}</div>`,
  };

  // ---------- Help ----------
  const HELP = [
    ['🚀', 'Getting Started', 'DealIntel ingests deal documents from Snowflake stages, classifies them with AI_CLASSIFY, extracts structured deal attributes with AI_EXTRACT, and makes everything searchable. Start on the Overview page for pipeline health and portfolio analytics.'],
    ['🔍', 'Document Search', 'Type a natural-language query. Cortex Search combines semantic vector similarity with keyword matching and reranking. Use Filters to narrow by sector, type, format or status, and 💾 to save a search.'],
    ['🤖', 'Ask a Question (Chat)', 'The Doc Intelligence Agent routes each question to document search, page-level search, or Cortex Analyst for numeric questions. Answers cite the source file and page — click a citation to preview.'],
    ['📂', 'Document Browser', 'Browse the full catalog with filters. Click a row for the attribute panel, submit corrections, or select multiple rows for batch actions.'],
    ['✅', 'Review Queue', 'Documents with classification confidence below the threshold land here. Approve, skip, or pick the correct type from the AI\'s alternative suggestions.'],
    ['📊', 'Portfolio Analytics', 'Ask numeric questions in plain English — Cortex Analyst generates SQL over the semantic view and returns tables and charts.'],
    ['🔖', 'Saved Items', 'Re-run saved searches and return to bookmarked documents.'],
    ['🛡', 'Administration', 'Admins manage the pipeline, extraction schema, classification labels, sectors, notifications, configuration and user entitlements.'],
  ];
  pages.help = {
    render: () => `<div class="page-wrap w-3xl">${header('❓', 'Help & Documentation', 'How to get the most out of DealIntel')}
      ${HELP.map(h => `<div class="card mb"><div class="row" style="padding:10px 16px;background:var(--surface-alt);border-bottom:1px solid var(--border);border-radius:12px 12px 0 0"><span>${h[0]}</span><b>${h[1]}</b></div><p style="padding:0 16px;font-size:13px;line-height:1.6;color:var(--text-2)">${h[2]}</p></div>`).join('')}
      <div class="card p4 note-blue note"><b>💡 Tips</b><ul style="margin:6px 0 0;padding-left:18px"><li>Scope a search to one file with “Search within this document”.</li><li>Corrections train the review workflow — admins approve them in Quality &amp; Feedback.</li><li>Dark mode lives in the user menu, top right.</li></ul></div></div>`,
  };
})();

</script>
  <script>
/* DealIntel demo — admin screens */
(function () {
  const { $, $$, esc, pages, header, stat, tabs, panel, empty, sectorBadge, statusBadge, fmtTag, confText, docLink, hbar, vbar, line, countBy, toast } = DI;
  const D = DATA.docs;
  const table = (cols, rows) => `<div class="table-wrap"><table class="t"><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  const tr = cells => `<tr>${cells.map(c => `<td>${c}</td>`).join('')}</tr>`;
  const refresh = '<button class="btn btn-secondary btn-sm" data-toast="Refreshed">↻ Refresh</button>';

  // ---------- Pipeline ----------
  const STEPS = [['Register Files', 'Scan stages for new documents', '📥'], ['Parse Documents', 'AI_PARSE_DOCUMENT on pending files', '📄'], ['Classify', 'AI_CLASSIFY document types', '🏷️'], ['Extract', 'AI_EXTRACT deal attributes', '🧬']];
  pages['admin-pipeline'] = {
    render: () => { const R = DATA.registry, c = s => R.filter(r => r.status === s).length; return `<div class="page-wrap w-6xl">${header('📈', 'Pipeline Management', 'Parse → Classify → Extract → Catalog', refresh)}
      <div class="grid g4 mb">${stat('Complete', c('COMPLETE'), '', '#16a34a')}${stat('Pending', c('PENDING'), '', '#d97706')}${stat('Processing', c('PROCESSING'), '', '#2563eb')}${stat('Failed', c('FAILED'), '', '#dc2626')}</div>
      ${tabs('pl', ['▦ Overview', '⬆ Upload', '🗄 Stages', '▶ Run Pipeline', '📜 Processing Logs', '↻ Reprocess'])}
      <div class="card p5">
      ${panel('pl', 0, `<h3 class="section-title">Pipeline Tasks</h3>${table(['Task', 'State', 'Schedule', ''], DATA.tasks.map(t => tr([`<span class="mono">${t.name}</span>`, t.state === 'started' ? '<span class="badge" style="background:#dcfce7;color:#15803d">▶ started</span>' : '<span class="badge" style="background:#f1f5f9;color:#475569">⏸ suspended</span>', t.sched, `<button class="btn btn-secondary btn-sm" data-task="${t.name}">${t.state === 'started' ? 'Suspend' : 'Resume'}</button>`])))}`)}
      ${panel('pl', 1, `<div class="dropzone" id="drop"><div style="font-size:32px">⬆</div><b>Drop a file here or click to browse</b><div class="sub">PDF, TIFF, DOCX, JPEG, PNG, HTML, TXT (max 50MB)</div></div><button class="btn btn-primary mt" data-toast="File uploaded to @deal_documents_stage and registered">Upload and Register</button>`)}
      ${panel('pl', 2, `${[['DEAL_DOCUMENTS_STAGE', 'Primary deal document drop', 'deals/', true], ['IR_REPORTS_STAGE', 'LP reports from fund admin', 'ir/', true], ['LEGACY_SCANS_STAGE', 'Historical scanned archive', 'scans/', false]].map(s => `<div class="list-row"><span class="mono" style="flex:1">@${s[0]}<div class="sub">${s[1]} · prefix <span class="mono">${s[2]}</span></div></span><button class="switch${s[3] ? ' on' : ''}"></button><button class="btn btn-secondary btn-sm" data-toast="Stage removed">Remove</button></div>`).join('')}
        <div class="card p4 mt"><b>Add New Stage</b><div class="row mt"><input placeholder="Stage name"><input placeholder="Description"><input placeholder="Path prefix"><button class="btn btn-primary btn-sm" data-toast="Stage added">Add Stage</button></div></div>
        <div class="card p4 mt row between"><div><b>Discover Available Stages</b><div class="sub">Scan the database for stages not yet registered</div></div><button class="btn btn-secondary btn-sm" data-toast="Found 1 unregistered stage: @DATA_ROOM_EXPORT">🔎 Scan Database</button></div>`)}
      ${panel('pl', 3, `<p class="sub">Steps run sequentially: Register → Parse → Classify → Extract</p><div class="grid g4">${STEPS.map((s, i) => `<div class="card p4"><div style="font-size:22px">${s[2]}</div><b>${i + 1}. ${s[0]}</b><div class="sub" style="min-height:34px">${s[1]}</div><button class="btn btn-secondary btn-sm mt" data-step="${i}">▶ Run</button><div class="sub mt" id="step-${i}"></div></div>`).join('')}</div><button class="btn btn-primary mt" id="run-all">▶ Run Full Pipeline</button>`)}
      ${panel('pl', 4, `<div class="row between mb"><b>Processing Logs (${R.length} total)</b><select><option>All statuses</option><option>FAILED</option><option>COMPLETE</option></select></div>${table(['File', 'Status', 'Folder', 'Type', 'Portfolio Co.', 'Error'], R.slice(0, 12).map((r, i) => tr([`<span class="mono">${esc(r.file)}</span>`, statusBadge(r.status), r.folder, esc(D[i]?.type || '—'), esc(D[i]?.company || '—'), `<span style="color:#dc2626">${esc(r.err)}</span>`])))}`)}
      ${panel('pl', 5, `<div class="row mb"><input placeholder="Filter by filename" style="flex:1"><select><option>All statuses</option></select><select><option>All sectors</option></select></div>
        <div class="row between sub mb"><span id="rp-n">${D.length} documents · 0 selected</span><span class="row"><button class="btn btn-secondary btn-sm" id="rp-all">Select All</button><button class="btn btn-secondary btn-sm" id="rp-clr">Clear</button></span></div>
        <div class="card" style="max-height:320px;overflow:auto">${D.map(d => `<label class="list-row"><input type="checkbox" class="rp"><span class="mono" style="flex:1">${esc(d.file)}</span>${sectorBadge(d.sector)}<span class="chip">${esc(d.type)}</span>${statusBadge('complete')}</label>`).join('')}</div>
        <div class="row mt"><button class="btn btn-primary" id="rp-go">Reprocess Selected (0)</button><button class="btn btn-amber" data-toast="${D.length} documents queued for reprocessing">Reprocess All Filtered (${D.length})</button></div>`)}
      </div></div>`; },
    mount: root => {
      root.addEventListener('click', e => {
        const t = e.target.closest('[data-task]');
        if (t) { const task = DATA.tasks.find(x => x.name === t.dataset.task); task.state = task.state === 'started' ? 'suspended' : 'started'; toast(`${task.name} ${task.state}`); const row = t.closest('tr'); row.cells[1].innerHTML = task.state === 'started' ? '<span class="badge" style="background:#dcfce7;color:#15803d">▶ started</span>' : '<span class="badge" style="background:#f1f5f9;color:#475569">⏸ suspended</span>'; t.textContent = task.state === 'started' ? 'Suspend' : 'Resume'; }
        const s = e.target.closest('[data-step]');
        if (s) runStep(+s.dataset.step);
      });
      const runStep = (i, next) => { $(`#step-${i}`).innerHTML = '⏳ Running…'; setTimeout(() => { $(`#step-${i}`).innerHTML = `<span style="color:#16a34a">✓ ${[3, 3, 3, 3][i]} files processed</span>`; next ? next() : toast(`${STEPS[i][0]} complete`); }, 900); };
      $('#run-all').addEventListener('click', () => runStep(0, () => runStep(1, () => runStep(2, () => runStep(3)))));
      $('#drop').addEventListener('click', () => toast('File picker is simulated in the demo', 'info'));
      const cnt = () => { const n = $$('.rp:checked').length; $('#rp-n').textContent = `${D.length} documents · ${n} selected`; $('#rp-go').textContent = `Reprocess Selected (${n})`; };
      $$('.rp').forEach(c => c.addEventListener('change', cnt));
      $('#rp-all').addEventListener('click', () => { $$('.rp').forEach(c => c.checked = true); cnt(); });
      $('#rp-clr').addEventListener('click', () => { $$('.rp').forEach(c => c.checked = false); cnt(); });
      $('#rp-go').addEventListener('click', () => { toast(`${$$('.rp:checked').length} documents queued for reprocessing`); $('#rp-clr').click(); });
    },
  };

  // ---------- Registry ----------
  pages['admin-registry'] = {
    render: () => `<div class="page-wrap w-6xl">${header('📋', 'Ingestion Registry', 'Every file discovered on registered stages', refresh)}
      <div class="card p4 mb row"><select id="rg-s"><option value="">All statuses</option>${['PENDING', 'PROCESSING', 'COMPLETE', 'FAILED', 'ABANDONED'].map(s => `<option>${s}</option>`).join('')}</select><input id="rg-q" placeholder="Search file name…"><span class="sub" id="rg-n" style="margin-left:auto"></span></div>
      <div class="card" id="rg-t"></div></div>`,
    mount: () => {
      const draw = () => {
        const s = $('#rg-s').value, q = $('#rg-q').value.toLowerCase(), rows = DATA.registry.filter(r => (!s || r.status === s) && r.file.toLowerCase().includes(q));
        $('#rg-n').textContent = `${rows.length} total documents`;
        $('#rg-t').innerHTML = table(['File Path', 'Format', 'Folder', 'Status', 'Ver', 'Attempts', 'First Seen', 'Last Error', ''], rows.map(r => tr([`<a class="link mono" href="#">${esc(r.file)}</a>`, fmtTag(r.fmt), r.folder, statusBadge(r.status), r.ver, r.attempts, `<span class="sub">${r.seen}</span>`, `<span style="color:#dc2626">${esc(r.err)}</span>`, `<button class="btn btn-secondary btn-sm" data-toast="Requeued ${esc(r.file)}">↺</button>`])));
      };
      $('#rg-s').addEventListener('change', draw); $('#rg-q').addEventListener('input', draw); draw();
    },
  };

  // ---------- Quality ----------
  pages['admin-quality'] = {
    render: () => { const avg = D.reduce((s, d) => s + d.conf, 0) / D.length, low = D.filter(d => d.review).length;
      const bySec = Object.entries(D.reduce((m, d) => ((m[d.sector] = m[d.sector] || []).push(d.conf), m), {})).map(([k, v]) => [k, Math.round(v.reduce((a, b) => a + b, 0) / v.length * 100)]);
      return `<div class="page-wrap w-5xl">${header('☑️', 'Quality & Feedback', 'Extraction confidence, corrections and user feedback', refresh)}
      <div class="grid g4 mb">${stat('Avg Confidence', (avg * 100).toFixed(1) + '%', '', '#166534')}${stat('Low Conf Docs', low, '', '#d97706')}${stat('Low Conf %', Math.round(low / D.length * 100) + '%', '', '#d97706')}${stat('Document Types', new Set(D.map(d => d.type)).size, '', '#1e40af')}</div>
      <div class="grid g2 mb"><div class="card p5 chart"><div class="chart-title">Corrections by Field</div>${hbar([['deal_stage', 7], ['document_type', 5], ['target_company', 4], ['fund_name', 2], ['investment_date', 1]], '#f59e0b')}</div>
        <div class="card p5 chart"><div class="chart-title">Avg Confidence by Sector (%)</div>${vbar(bySec, ['#29B5E8', '#11567F', '#C5A55A', '#7C3AED', '#22C55E'])}</div></div>
      <div class="card p5 mb"><h3 class="section-title">Pending Corrections (${DATA.corrections.length})</h3><div id="corr-t">${table(['File', 'Field', 'Original', 'Corrected', 'Submitted By', 'Date', ''], DATA.corrections.map((c, i) => `<tr data-i="${i}"><td class="mono">${esc(c.file)}</td><td><b>${c.field}</b></td><td style="color:#dc2626;text-decoration:line-through">${esc(c.orig)}</td><td style="color:#16a34a">${esc(c.corr)}</td><td>${c.by}</td><td>${c.date}</td><td style="white-space:nowrap"><button class="btn btn-green btn-sm" data-ok>✓</button> <button class="btn btn-red btn-sm" data-no>⊗</button></td></tr>`))}</div></div>
      <div class="card p5"><h3 class="section-title">Recent User Feedback (${DATA.feedback.length})</h3>${table(['Type', 'File', 'Query', 'User', 'Date'], DATA.feedback.map(f => tr([f.up ? '<span style="color:#16a34a">👍</span>' : '<span style="color:#dc2626">👎</span>', `<span class="mono">${esc(f.file)}</span>`, esc(f.q), f.user, f.date])))}</div></div>`; },
    mount: () => $('#corr-t').addEventListener('click', e => {
      const b = e.target.closest('[data-ok],[data-no]'); if (!b) return;
      const row = b.closest('tr'); row.style.opacity = '.4'; row.lastElementChild.innerHTML = b.hasAttribute('data-ok') ? '<span style="color:#16a34a">Approved</span>' : '<span style="color:#dc2626">Rejected</span>';
      toast(b.hasAttribute('data-ok') ? 'Correction applied to catalog' : 'Correction rejected');
    }),
  };

  // ---------- Cost ----------
  pages['admin-cost'] = {
    render: () => { const cr = DATA.credits, last = cr[cr.length - 1]; return `<div class="page-wrap w-5xl">${header('💲', 'Credit Cost Dashboard', 'Snowflake credit consumption for the DealIntel pipeline', refresh)}
      <div class="grid g3 mb">${stat('Total Credits (30 days)', last.toFixed(3), '')}${stat('Daily Average', (last / 30).toFixed(3), 'Credits/day')}${stat('Projected Monthly', (last * 1.04).toFixed(2), 'Based on trailing daily average')}</div>
      <div class="card p5 mb chart"><div class="chart-title">Monthly Credit Usage (1 year)</div>${line(DATA.months, cr)}</div>
      <div class="grid g2 mb"><div class="card p5 chart"><div class="chart-title">Credits by Stage (1 year)</div>${hbar([['Parse', 38.2], ['Extract', 29.7], ['Classify', 14.1], ['Search Index', 11.8], ['Agent', 8.6], ['Analyst', 3.0]])}</div>
        <div class="card p5 chart"><div class="chart-title">Credits by Event Type (1 year)</div>${vbar([['AI_PARSE', 38], ['AI_EXTRACT', 30], ['AI_CLASSIFY', 14], ['EMBED', 12], ['COMPLETE', 11]])}</div></div>
      <div class="card p5"><h3 class="section-title">💡 Cost Optimization Tips</h3><div class="grid g2">${[['Prefer digital PDFs', 'Native-text PDFs skip OCR and parse ~4× cheaper than scans.'], ['Filter first pages', 'Classify on the first 3 pages — enough signal for most document types.'], ['Right-size warehouse', 'XS/S is sufficient for pipeline tasks; scale up only for backfills.'], ['Incremental only', 'Dynamic Table + primary keys avoid re-embedding unchanged documents.']].map(t => `<div class="card p4"><b>${t[0]}</b><div class="sub mt">${t[1]}</div></div>`).join('')}</div></div></div>`; },
  };

  // ---------- Extraction Schema ----------
  const TIER_STYLE = { Common: ['🌐', '#d1fae5', '#047857'], Category: ['🏷', '#dbeafe', '#1d4ed8'], 'Sector-Specific': ['⚡', '#f3e8ff', '#7e22ce'] };
  pages['admin-schema'] = {
    render: () => `<div class="page-wrap w-5xl">${header('⌨️', 'Extraction Schema', 'Configure which attributes AI_EXTRACT pulls from each document', '<button class="btn btn-primary btn-sm" id="add-attr">+ Add Attribute</button><button class="btn btn-secondary btn-sm" data-toast="Schema reloaded">↻ Reload</button>')}
      ${tabs('es', ['▤ Schema Configuration', '🧪 Test Lab'])}
      ${panel('es', 0, `<p class="sub">Three-tier extraction model. <b>Common</b> attributes apply to every document, <b>Category</b> attributes to a document category, and <b>Sector-Specific</b> attributes to a sector.</p>
        <div class="row mb" id="tiers">${Object.keys(DATA.schema).map((t, i) => `<button class="badge" data-tier="${t}" style="border:0;background:${TIER_STYLE[t][1]};color:${TIER_STYLE[t][2]};padding:6px 14px;${i === 0 ? 'box-shadow:0 0 0 2px ' + TIER_STYLE[t][2] : ''}">${TIER_STYLE[t][0]} ${t} (${Object.keys(DATA.schema[t]).length})</button>`).join('')}</div>
        <div class="card p4 mb hidden" id="attr-form" style="border-color:var(--brand-primary)"><div class="grid g3"><input placeholder="Attribute name"><input placeholder="Description (AI prompt)"><select><option>VARCHAR</option><option>DATE</option><option>NUMBER</option><option>VARIANT</option></select></div><button class="btn btn-primary btn-sm mt" data-toast="Attribute added">Save Attribute</button></div>
        <div class="split"><div class="card p4" style="width:220px;flex-shrink:0" id="groups"></div><div class="main card" id="attrs"></div></div><div id="test-res"></div>`)}
      ${panel('es', 1, `<p class="sub">Parse → Classify → Detect Sector → Resolve Schema → Extract. Results are <b>not saved</b>.</p>
        <div class="card p4 mb"><div class="row"><select style="width:288px"><option>@DEAL_DOCUMENTS_STAGE</option><option>@IR_REPORTS_STAGE</option></select><button class="btn btn-secondary btn-sm" data-toast="Upload is simulated">⬆ Upload File</button><button class="btn btn-primary btn-sm" id="tl-run">▶ Run Pipeline (<span id="tl-n">2</span>)</button></div>
          <div class="note note-blue mt" id="tl-pins"></div>
          <div class="sub mt mb">${D.length} of ${D.length} files</div><div style="max-height:220px;overflow:auto">${D.map((d, i) => `<label class="list-row"><input type="checkbox" class="pin" data-i="${i}" ${i < 2 ? 'checked' : ''}>📌<span class="mono" style="flex:1">${esc(d.file)}</span><span class="sub">${(d.pages * 41.3).toFixed(0)} KB</span></label>`).join('')}</div></div>
        <div id="tl-out"></div>`)}</div>`,
    mount: () => {
      let tier = 'Common', group = Object.keys(DATA.schema.Common)[0];
      const drawGroups = () => {
        const gs = DATA.schema[tier];
        if (!gs[group]) group = Object.keys(gs)[0];
        $('#groups').innerHTML = `<div class="lbl-up mb">${tier} Groups</div>${Object.keys(gs).map(g => `<a href="#" class="list-row" data-group="${g}" style="border-radius:6px;${g === group ? 'background:var(--brand-pale);color:var(--brand-primary);font-weight:600' : ''}">${g}<span class="chip" style="margin-left:auto">${gs[g].attrs.length}</span></a>`).join('')}
          <div class="lbl-up mt">Fires when</div>${Object.entries(gs[group].rule).map(([k, v]) => `<div class="sub mono">${k}: ${v}</div>`).join('')}`;
        const st = TIER_STYLE[tier];
        $('#attrs').innerHTML = `<div class="row p4" style="border-bottom:1px solid var(--border)"><b>${group} — ${gs[group].attrs.length} attributes</b><span class="badge" style="background:${st[1]};color:${st[2]}">${tier}</span></div>${table(['#', 'Attribute', 'Description', 'Type', ''], gs[group].attrs.map((a, i) => tr([i + 1, `<span class="mono">${a[0]}</span>`, esc(a[1]), `<span class="chip">${a[2]}</span>`, `<button class="btn-sm" style="border:0;background:none" data-test="${a[0]}">🧪</button><button class="btn-sm" style="border:0;background:none" data-toast="Attribute removed">🗑</button>`])))}`;
      };
      const drawPins = () => { const p = $$('.pin:checked'); $('#tl-n').textContent = p.length; $('#tl-pins').innerHTML = `📌 <b>Test List (${p.length} pinned)</b>` + p.map(c => `<div class="mono" style="margin-top:4px">${esc(D[c.dataset.i].file)}</div>`).join(''); };
      $('#tiers').addEventListener('click', e => { const b = e.target.closest('[data-tier]'); if (!b) return; tier = b.dataset.tier; $$('#tiers [data-tier]').forEach(x => x.style.boxShadow = x === b ? `0 0 0 2px ${TIER_STYLE[x.dataset.tier][2]}` : ''); drawGroups(); });
      $('#groups').addEventListener('click', e => { const g = e.target.closest('[data-group]'); if (g) { e.preventDefault(); group = g.dataset.group; drawGroups(); } });
      $('#attrs').addEventListener('click', e => { const t = e.target.closest('[data-test]'); if (t) $('#test-res').innerHTML = `<div class="note note-blue mt row between"><span>Testing <span class="mono">${t.dataset.test}</span> on <span class="mono">${esc(D[0].file)}</span> — Result: <b>${esc(D[0][{ target_company: 'company', deal_name: 'deal', sponsor_name: 'sponsor', sector: 'sector', deal_stage: 'stage', enterprise_value: 'ev', equity_check: 'equity', target_irr: 'irr', target_moic: 'moic', key_risks: 'risks', fund_name: 'fund' }[t.dataset.test]] || 'null (not found)')}</b></span><button class="btn btn-secondary btn-sm" id="dismiss">Dismiss</button></div>`; });
      $('#test-res').addEventListener('click', e => { if (e.target.id === 'dismiss') $('#test-res').innerHTML = ''; });
      $('#add-attr').addEventListener('click', () => $('#attr-form').classList.toggle('hidden'));
      $$('.pin').forEach(c => c.addEventListener('change', drawPins));
      $('#tl-run').addEventListener('click', () => {
        const p = $$('.pin:checked').map(c => D[c.dataset.i]);
        $('#tl-out').innerHTML = '<div class="card p4">⏳ Running parse → classify → extract…</div>';
        setTimeout(() => { $('#tl-out').innerHTML = `<div class="row mb"><b>${p.length} files processed</b><span class="badge" style="background:#fef3c7;color:#b45309">Test mode — not saved</span></div>` + p.map((d, i) => `<details class="card mb" ${i === 0 ? 'open' : ''}><summary class="p4 row" style="cursor:pointer"><span class="mono">${esc(d.file)}</span><span class="badge" style="background:#dbeafe;color:#1d4ed8">${esc(d.type)}</span>${sectorBadge(d.sector)}<span class="sub">9 fields</span></summary>
          ${table(['', 'Field', 'Value', 'Tier'], [['target_company', d.company, 'Common'], ['deal_name', d.deal, 'Common'], ['sector', d.sector, 'Common'], ['deal_stage', d.stage, 'Common'], ['enterprise_value', d.ev, 'Category · Deal Sourcing'], ['equity_check', d.equity, 'Category · Deal Sourcing'], ['target_irr', d.irr, 'Category · Deal Sourcing'], ['key_risks', d.risks, 'Category · Due Diligence'], ['mw_capacity', d.sector === 'Digital Infrastructure' ? '300' : null, 'Sector · DINFRA']].map(f => tr([f[1] && f[1] !== '—' ? '<span style="color:#16a34a">✓</span>' : '<span style="color:#dc2626">✗</span>', `<span class="mono">${f[0]}</span>`, f[1] && f[1] !== '—' ? esc(f[1]) : '<span class="muted">not found</span>', `<span class="chip">${f[2]}</span>`])))}</details>`).join(''); }, 1200);
      });
      drawGroups(); drawPins();
    },
  };

  // ---------- Classification Labels ----------
  pages['admin-labels'] = {
    render: () => `<div class="page-wrap w-3xl">${header('🏷️', 'Classification Labels', 'Labels AI_CLASSIFY chooses from, grouped by category')}
      <div class="card p4 mb row"><input placeholder="Label name" style="flex:1"><select>${Object.keys(DATA.labels).map(c => `<option>${c}</option>`).join('')}</select><button class="btn btn-secondary btn-sm" data-toast="New category form (demo)">📁+</button><button class="btn btn-primary btn-sm" data-toast="Label added">+ Add</button></div>
      ${Object.entries(DATA.labels).map(([cat, ls], ci) => `<div class="card mb"><div class="row between p4" style="border-bottom:1px solid var(--border)"><b>${cat} (${ls.length})</b><span><button class="btn-sm" style="border:0;background:none" data-toast="Rename category (demo)">✏️</button><button class="btn-sm" style="border:0;background:none" data-toast="Delete category (demo)">🗑</button></span></div>
        ${ls.map((l, i) => `<div class="list-row${(ci + i) % 7 === 6 ? ' fade' : ''}"><span style="flex:1">${l}</span><button class="switch${(ci + i) % 7 === 6 ? '' : ' on'}"></button><button class="btn-sm" style="border:0;background:none" data-toast="Label deleted">🗑</button></div>`).join('')}</div>`).join('')}</div>`,
  };

  // ---------- Sectors ----------
  pages['admin-sectors'] = {
    render: () => `<div class="page-wrap w-3xl">${header('💼', 'Investment Sectors', 'Sectors drive AI classification and access control', refresh + '<button class="btn btn-primary btn-sm" id="sec-add">+ Add Sector</button>')}
      <div class="card p4 mb hidden" id="sec-form"><div class="grid g3"><input placeholder="Sector code"><input placeholder="Display name"><input placeholder="Description"></div><div class="row mt"><button class="btn btn-primary btn-sm" data-toast="Sector created">Create</button><button class="btn btn-secondary btn-sm" id="sec-cancel">Cancel</button></div></div>
      <div class="card">${table(['Code', 'Name', 'Description', 'Active', ''], DATA.sectors.map(s => tr([`<span class="mono">${s.code}</span>`, `<b>${s.name}</b>`, `<span class="sub">${s.desc}</span>`, `<button class="switch${s.active ? ' on' : ''}"></button>`, '<button class="btn-sm" style="border:0;background:none" data-toast="Inline edit (demo)">✏️</button><button class="btn-sm" style="border:0;background:none" data-toast="Sector deleted">🗑</button>'])))}</div></div>`,
    mount: () => { $('#sec-add').addEventListener('click', () => $('#sec-form').classList.remove('hidden')); $('#sec-cancel').addEventListener('click', () => $('#sec-form').classList.add('hidden')); },
  };

  // ---------- Notifications ----------
  const EVENTS = ['INGEST', 'PARSE', 'CLASSIFY', 'EXTRACT', 'ALERT', 'ARCHIVE', 'PURGE', 'OVERRIDE', 'FEEDBACK', 'DOWNLOAD'];
  pages['admin-notifications'] = {
    render: () => `<div class="page-wrap w-3xl">${header('🔔', 'Notification Rules', 'Route pipeline events to webhooks or email', '<button class="btn btn-primary btn-sm" id="nt-add">+ Add Rule</button>' + refresh)}
      <div class="card p4 mb hidden" id="nt-form"><div class="grid g2"><select><option>Webhook (HTTP POST)</option><option>Email (Snowflake Integration)</option></select><input placeholder="Endpoint / address"></div>
        <div class="lbl-up mt">Event types</div><div class="row mt">${EVENTS.map(e => `<label class="chip row"><input type="checkbox">${e}</label>`).join('')}</div><div class="row mt"><input type="number" value="0" style="width:120px"><span class="sub">Threshold (0 = all events)</span></div>
        <div class="row mt"><button class="btn btn-primary btn-sm" data-toast="Rule saved">Save Rule</button><button class="btn btn-secondary btn-sm" id="nt-cancel">Cancel</button></div></div>
      ${DATA.notifications.map(n => `<div class="card p4 mb row between"><div><b style="text-transform:uppercase;font-size:12px">${n.ch === 'webhook' ? '🌐' : '✉️'} ${n.ch}</b><div class="mono mt">${esc(n.ep)}</div><div class="row mt">${n.events.map(e => `<span class="chip" style="background:#dbeafe;color:#1d4ed8">${e}</span>`).join('')}</div></div><div class="row"><button class="switch${n.on ? ' on' : ''}"></button><button class="btn-sm" style="border:0;background:none" data-toast="Rule deleted">🗑</button></div></div>`).join('')}</div>`,
    mount: () => { $('#nt-add').addEventListener('click', () => $('#nt-form').classList.remove('hidden')); $('#nt-cancel').addEventListener('click', () => $('#nt-form').classList.add('hidden')); },
  };

  // ---------- Config ----------
  pages['admin-config'] = {
    render: () => `<div class="page-wrap w-4xl">${header('⚙️', 'System Configuration', 'Runtime settings stored in ADMIN.app_config')}
      ${Object.entries(DATA.config).map(([g, rows]) => `<div class="card mb"><div class="p4" style="border-bottom:1px solid var(--border)"><b>${g}</b></div>${rows.map(r => `<div class="list-row"><div style="flex:1"><div class="mono"><b>${r[0]}</b></div><div class="sub">${r[1]}</div></div>${r[0] === 'search_embedding_model' ? `<span class="chip">🔒 ${r[2]}</span>` : r[0] === 'pipeline_enabled' ? `<select><option>Enabled</option><option>Disabled</option></select>` : /model/.test(r[0]) ? `<select><option>${r[2]}</option><option>claude-opus-4-5</option><option>llama3.3-70b</option><option>mistral-large2</option></select>` : `<input value="${esc(r[2])}" style="width:220px">`}${r[0] === 'search_embedding_model' ? '' : '<button class="btn btn-secondary btn-sm cfg-save">Save</button>'}</div>`).join('')}</div>`).join('')}</div>`,
    mount: root => root.addEventListener('click', e => { const b = e.target.closest('.cfg-save'); if (b) { b.textContent = '✓ Saved'; b.style.color = '#16a34a'; toast('Setting saved'); } }),
  };

  // ---------- Audit ----------
  pages['admin-audit'] = {
    render: () => { const A = DATA.audit; return `<div class="page-wrap w-5xl">${header('🛡️', 'Audit Log', 'Downloads, overrides, archives and purges', '<button class="btn btn-secondary btn-sm" data-toast="Exported audit_log.csv">⬇ Export CSV</button>' + refresh)}
      <div class="card p4 mb row"><select><option>Last 7 days</option><option>Last 14 days</option><option>Last 30 days</option><option>Last 90 days</option></select><select id="au-t"><option value="">All event types</option>${[...new Set(A.map(a => a[2]))].map(t => `<option>${t}</option>`).join('')}</select><select id="au-u"><option value="">All users</option>${[...new Set(A.map(a => a[1]))].map(u => `<option>${u}</option>`).join('')}</select></div>
      <div class="grid g4 mb">${countBy(A.map(a => ({ t: a[2], u: a[1] })), 't').slice(0, 4).map(([t, n]) => stat(t, n, `${new Set(A.filter(a => a[2] === t).map(a => a[1])).size} users`)).join('')}</div>
      <div class="card"><div class="p4" style="border-bottom:1px solid var(--border)"><b id="au-n"></b></div><div id="au-rows" style="max-height:500px;overflow:auto"></div></div></div>`; },
    mount: () => {
      const draw = () => { const t = $('#au-t').value, u = $('#au-u').value, rows = DATA.audit.filter(a => (!t || a[2] === t) && (!u || a[1] === u));
        $('#au-n').textContent = `Events (${rows.length})`;
        $('#au-rows').innerHTML = table(['Timestamp', 'User', 'Event Type', 'File'], rows.map(a => tr([`<span class="mono">${a[0]}</span>`, a[1], `<span class="chip" style="background:#dbeafe;color:#1d4ed8">${a[2]}</span>`, `<span class="mono">${esc(a[3])}</span>`]))); };
      $('#au-t').addEventListener('change', draw); $('#au-u').addEventListener('change', draw); draw();
    },
  };

  // ---------- Users ----------
  const APP_PAGES = ['Dashboard', 'Document Search', 'Review Queue', 'Ask a Question', 'Analytics', 'Document Browser', 'Saved Searches', 'Help'];
  pages['admin-users'] = {
    render: () => `<div class="page-wrap w-6xl">${header('👥', 'Access Management', 'Entitlement roles control pages, sectors and document types')}
      ${tabs('us', ['👥 Users', '⚙ Roles', '📍 Investment Sectors'], 0, 'segtabs')}
      ${panel('us', 0, `<div class="note note-amber mb">2 Snowflake role member(s) not yet configured</div>
        <div class="row mb"><button class="btn btn-secondary btn-sm" data-toast="Synced 2 users from DEAL_INTEL_USER">⇅ Sync from Roles</button>${refresh}<button class="btn btn-primary btn-sm" id="u-add">+ Add User</button></div>
        <div class="card p4 mb hidden" id="u-form" style="border-color:#93c5fd"><select style="width:100%"><option>ALEX.RIVERA (unregistered)</option><option>NINA.PATEL (unregistered)</option><option>Enter manually…</option></select>
          <div class="lbl-up mt">Assigned roles (access = union of all selected roles)</div><div class="grid g2 mt">${DATA.roles.map(r => `<label class="card p4 row"><input type="checkbox"><div><b>${r.name}</b><div class="sub">${r.desc}</div></div></label>`).join('')}</div><button class="btn btn-primary btn-sm mt" data-toast="User added">Save User</button></div>
        <div class="card"><div class="p4" style="border-bottom:1px solid var(--border)"><b>Users (${DATA.users.length})</b></div>${table(['User', 'Assigned Roles', 'Status', ''], DATA.users.map(u => tr([`<span class="mono">${u.user}</span>`, u.roles.map(r => `<span class="chip" style="background:#e0e7ff;color:#4338ca">${r}</span>`).join(' '), u.active ? '<span style="color:#16a34a;font-weight:600">Active</span>' : '<span style="color:#dc2626;font-weight:600">Inactive</span>', `<button class="btn btn-secondary btn-sm" data-toast="Edit user (demo)">Edit</button> <button class="btn btn-secondary btn-sm" data-toast="${u.active ? 'User deactivated' : 'User reactivated'}">${u.active ? 'Deactivate' : 'Reactivate'}</button>`])))}</div>`)}
      ${panel('us', 1, `<div class="row mb">${refresh}<button class="btn btn-primary btn-sm" id="r-add">+ Create Role</button></div>
        <div class="card p5 mb hidden" id="r-form"><div class="grid g2"><input placeholder="Role name" value="Portfolio Ops"><input placeholder="Description" value="Portfolio monitoring documents"></div>
          <div class="lbl-up mt">App Pages</div><div class="row mt">${APP_PAGES.map((p, i) => `<label class="chip row"><input type="checkbox" ${i < 6 ? 'checked' : ''}>${p}</label>`).join('')}</div>
          <div class="lbl-up mt">Sector Access</div><div class="row mt">${DATA.sectors.map(s => `<label class="chip row"><input type="checkbox" ${['DINFRA', 'TRANS'].includes(s.code) ? 'checked' : ''}>${s.code}</label>`).join('')}</div>
          <div class="lbl-up mt">Document Type Access</div>${Object.entries(DATA.labels).map(([c, ls], i) => `<details class="mt"><summary class="sub" style="cursor:pointer"><b>${c}</b> ${i === 3 ? ls.length : 0}/${ls.length}</summary><div class="row mt">${ls.map(l => `<label class="chip row"><input type="checkbox" ${i === 3 ? 'checked' : ''}>${l}</label>`).join('')}</div></details>`).join('')}
          <label class="row mt sub"><input type="checkbox"> Allow document downloads</label><button class="btn btn-primary btn-sm mt" data-toast="Role saved">Save Role</button></div>
        <div class="card"><div class="p4" style="border-bottom:1px solid var(--border)"><b>Entitlement Roles (${DATA.roles.length})</b></div>${table(['Role', 'Description', 'Members', 'Pages', 'Sectors', 'Doc Types', 'Download', ''], DATA.roles.map(r => tr([`<b>${r.name}</b>`, `<span class="sub">${r.desc}</span>`, `<span class="chip">${r.members}</span>`, `${r.pages}/8`, r.sectors, r.types, r.dl ? 'Yes' : 'No', '<button class="btn btn-secondary btn-sm r-edit">Edit</button> <button class="btn-sm" style="border:0;background:none" data-toast="Role deleted">🗑</button>'])))}</div>`)}
      ${panel('us', 2, `<div class="card">${table(['Code', 'Name', 'Description', 'Default', 'Status', ''], DATA.sectors.map(s => tr([`<span class="mono">${s.code}</span>`, s.name, `<span class="sub">${s.desc}</span>`, s.def ? '<span class="badge" style="background:#fef3c7;color:#b45309">DEFAULT</span>' : '', s.active ? '<span style="color:#16a34a">Active</span>' : '<span class="muted">Inactive</span>', '<button class="btn btn-secondary btn-sm" data-toast="Edit sector (demo)">Edit</button>'])))}</div>`)}</div>`,
    mount: root => {
      $('#u-add').addEventListener('click', () => $('#u-form').classList.toggle('hidden'));
      $('#r-add').addEventListener('click', () => $('#r-form').classList.toggle('hidden'));
      root.addEventListener('click', e => { if (e.target.closest('.r-edit')) { $('#r-form').classList.remove('hidden'); $('#r-form').scrollIntoView({ behavior: 'smooth' }); } });
    },
  };
})();

</script>
  <script>DI.start();</script>
</body>
</html>
